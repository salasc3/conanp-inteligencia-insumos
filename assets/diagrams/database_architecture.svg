<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">CONANP pilot database architecture</title>
  <desc id="desc">A relational architecture diagram showing source inventory, normalized occurrences, deduplicated occurrences, species index, summaries, and dashboard views.</desc>
  <defs>
    <style>
      .bg{fill:#f6f7f8}.table{fill:#fff;stroke:#d9dee3;stroke-width:2;rx:14}.core{stroke:#0b6b55;stroke-width:4}.view{stroke:#245e91;stroke-width:3}.text{font-family:Avenir Next,Segoe UI,sans-serif;fill:#17201d}.title{font-family:Georgia,serif;font-size:34px;font-weight:700}.h{font-size:20px;font-weight:800}.field{font-size:14px;fill:#66706d}.key{font-size:14px;fill:#0b6b55;font-weight:800}.arrow{stroke:#66706d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#66706d"/></marker>
  </defs>
  <rect class="bg" width="1400" height="820"/>
  <text class="text title" x="70" y="76">Pilot database architecture</text>
  <text class="text field" x="70" y="108">Designed so every dashboard number can be traced back to a source file, row, authority, and review state.</text>

  <rect class="table" x="80" y="170" width="300" height="220"/>
  <text class="text h" x="105" y="210">source_inventory</text>
  <text class="text key" x="105" y="246">path, file_name</text>
  <text class="text field" x="105" y="274">anp_code, file_type</text>
  <text class="text field" x="105" y="302">role, size_bytes</text>
  <text class="text field" x="105" y="330">decreto / EPJ / GIS / biodiversity</text>

  <rect class="table core" x="500" y="130" width="400" height="300"/>
  <text class="text h" x="530" y="170">normalized_occurrences</text>
  <text class="text key" x="530" y="206">occurrence_uid</text>
  <text class="text field" x="530" y="234">anp_code, source_system</text>
  <text class="text field" x="530" y="262">scientific_name_raw, accepted_name</text>
  <text class="text field" x="530" y="290">lat, lon, event_year, locality</text>
  <text class="text field" x="530" y="318">source_file, source_row_number</text>
  <text class="text field" x="530" y="346">quality_flags, raw_trace</text>
  <text class="text field" x="530" y="374">is_representative_record</text>

  <rect class="table core" x="1020" y="170" width="300" height="220"/>
  <text class="text h" x="1045" y="210">species_index</text>
  <text class="text key" x="1045" y="246">species_uid</text>
  <text class="text field" x="1045" y="274">anp_code, accepted_name</text>
  <text class="text field" x="1045" y="302">family, class, kingdom</text>
  <text class="text field" x="1045" y="330">source_systems, authority_ids</text>
  <text class="text field" x="1045" y="358">traceability_status</text>

  <rect class="table view" x="130" y="520" width="260" height="170"/>
  <text class="text h" x="155" y="560">summary_by_anp</text>
  <text class="text field" x="155" y="596">source_records</text>
  <text class="text field" x="155" y="624">deduped_occurrences</text>
  <text class="text field" x="155" y="652">unique_taxa, flagged_records</text>

  <rect class="table view" x="510" y="520" width="300" height="170"/>
  <text class="text h" x="535" y="560">data_quality_summary</text>
  <text class="text field" x="535" y="596">missing_taxon</text>
  <text class="text field" x="535" y="624">possible_cross_source_duplicate</text>
  <text class="text field" x="535" y="652">coordinate_uncertainty_gt_10km</text>

  <rect class="table view" x="930" y="520" width="320" height="170"/>
  <text class="text h" x="955" y="560">dashboard views</text>
  <text class="text field" x="955" y="596">species explorer</text>
  <text class="text field" x="955" y="624">review queue / traceability drawer</text>
  <text class="text field" x="955" y="652">pipeline and feature modules</text>

  <path class="arrow" d="M380 280 H490"/>
  <path class="arrow" d="M900 280 H1010"/>
  <path class="arrow" d="M640 430 C620 470 300 470 270 510"/>
  <path class="arrow" d="M700 430 V510"/>
  <path class="arrow" d="M1120 390 C1140 450 1120 480 1100 510"/>
  <path class="arrow" d="M390 605 H500"/>
  <path class="arrow" d="M810 605 H920"/>

  <text class="text field" x="80" y="752">Supabase path: the same table names are available in supabase/schema.sql for hosted review, roles, and audit logs.</text>
</svg>
